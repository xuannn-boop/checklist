const storageKey='growth-exam-2026-grades234-attendance-v1';const oldGrade2Key='growth-exam-2026-grade2-attendance-v1';
const allowed=['pending','present','absent'],subjects=['chinese','math','english'];let grade=2,state={},canStore=true;
const $=id=>document.getElementById(id);
try{state=JSON.parse(localStorage.getItem(storageKey)||'{}')||{};if(!localStorage.getItem(storageKey)){const previous=JSON.parse(localStorage.getItem(oldGrade2Key)||'{}')||{};for(const s of roster.filter(x=>x.grade===2)){if(previous[s.id])state[s.id]=previous[s.id]}}}catch(e){canStore=false;state={}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statusFor(s,subject){const v=state[s.id]?.[subject];return allowed.includes(v)?v:'pending'}
function save(){if(!canStore)return;try{localStorage.setItem(storageKey,JSON.stringify(state))}catch(e){canStore=false;$('storageNote').textContent='此模式無法自動保存勾選紀錄，請用「備份全部勾選紀錄」儲存檔案。'}}
function cell(s,subject){if(!s[subject])return '<span class="not-required">不需施測</span>';const cur=statusFor(s,subject);const label={chinese:'國語',math:'數學',english:'英語'}[subject];return '<div class="status-group" role="group" aria-label="'+esc(s.name)+' '+label+'">'+[['pending','未登記'],['present','已到 ✓'],['absent','未到 ×']].map(([v,t])=>'<button type="button" class="status '+v+(cur===v?' selected':'')+'" aria-pressed="'+(cur===v)+'" data-id="'+esc(s.id)+'" data-subject="'+subject+'" data-value="'+v+'">'+t+'</button>').join('')+'</div><span class="noscreen">'+({pending:'未登記',present:'已到',absent:'未到'}[cur])+'</span>'}
function refreshGrade(){for(const g of [2,3,4])$('gradeCount'+g).textContent=roster.filter(s=>s.grade===g).length+' 位學生';document.querySelectorAll('.grade-tab').forEach(b=>{const active=Number(b.dataset.grade)===grade;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});$('examInfo').textContent=gradeInfo[grade];const classes=[...new Set(roster.filter(s=>s.grade===grade).map(s=>s.class))].sort((a,b)=>a-b);$('classFilter').innerHTML='<option value="all">全部班級</option>'+classes.map(n=>'<option value="'+n+'">'+grade+String(n).padStart(2,'0')+'</option>').join('');$('subjectFilter').value='all';$('subjectFilter').querySelector('option[value="english"]').hidden=grade!==4;$('search').value='';$('englishHeader').style.display=grade===4?'':'none';$('englishStat').style.display=grade===4?'':'none';render()}
function render(){const arr=roster.filter(s=>s.grade===grade),klass=$('classFilter').value,sub=$('subjectFilter').value,q=$('search').value.trim().toLowerCase();let shown=arr.filter(s=>(klass==='all'||String(s.class)===klass)&&(sub==='all'||s[sub])&&(!q||(`${s.name} ${s.grade}${String(s.class).padStart(2,'0')} ${s.seat}`).toLowerCase().includes(q)));$('body').innerHTML=shown.length?shown.map(s=>'<tr><td data-label="班級"><strong>'+s.grade+String(s.class).padStart(2,'0')+'</strong></td><td data-label="座號">'+s.seat+'</td><td data-label="姓名" class="student">'+esc(s.name)+'</td><td data-label="國語">'+cell(s,'chinese')+'</td><td data-label="數學">'+cell(s,'math')+'</td>'+(grade===4?'<td data-label="英語">'+cell(s,'english')+'</td>':'')+'</tr>').join(''):'<tr><td colspan="'+(grade===4?6:5)+'" class="empty">沒有符合條件的學生</td></tr>';
$('people').textContent=arr.length+' 人';for(const [sub,id] of [['chinese','chineseCount'],['math','mathCount'],['english','englishCount']]){const eligible=arr.filter(s=>s[sub]);$(id).textContent=eligible.filter(s=>statusFor(s,sub)==='present').length+' / '+eligible.length}}
document.querySelector('.grade-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-grade]');if(!b)return;grade=Number(b.dataset.grade);refreshGrade()});
$('body').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;const {id,subject,value}=b.dataset;const s=roster.find(x=>x.id===id);if(!s||!s[subject])return;if(!state[id])state[id]={};state[id][subject]=value;save();render()});
for(const id of ['classFilter','subjectFilter','search'])$(id).addEventListener(id==='search'?'input':'change',render);
function download(content,name,type){const b=new Blob([content],{type});const url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
const readable=v=>({pending:'未登記',present:'已到',absent:'未到'}[v]);
function exportCSV(rows,filename){const values=[['年級','班級','座號','姓名','國語應考','國語到考','數學應考','數學到考','英語應考','英語到考'],...rows.map(s=>[s.grade,`${s.grade}${String(s.class).padStart(2,'0')}`,s.seat,s.name,...subjects.flatMap(sub=>[s[sub]?'是':'否',s[sub]?readable(statusFor(s,sub)):'不需施測'])])];download('\ufeff'+values.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),filename,'text/csv;charset=utf-8')}
$('exportCSV').onclick=()=>{exportCSV(roster,'成長測驗_2至4通_全部到考紀錄.csv');toast('已匯出全年級紀錄')};
$('exportCurrent').onclick=()=>{exportCSV(roster.filter(s=>s.grade===grade),`${grade}通_到考紀錄.csv`);toast('已匯出本年級紀錄')};
$('exportJSON').onclick=()=>{download(JSON.stringify({version:2,grades:[2,3,4],records:state,savedAt:new Date().toISOString()},null,2),'成長測驗_2至4通_勾選備份.json','application/json');toast('全部年級備份已匯出')};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(![1,2].includes(obj.version)||!obj.records||typeof obj.records!=='object'||Array.isArray(obj.records))throw Error();if(!confirm('確定匯入備份？這會取代目前三個年級的勾選紀錄。'))return;const clean={};for(const s of roster){const r=obj.records[s.id];if(!r)continue;clean[s.id]={};for(const sub of subjects)if(s[sub]&&allowed.includes(r[sub]))clean[s.id][sub]=r[sub]}state=clean;save();render();toast('已匯入備份')}catch(err){alert('無法讀取備份，請確認檔案格式。')}finally{e.target.value=''}});
$('print').onclick=()=>window.print();$('reset').onclick=()=>{if(!confirm(`確定清除${grade}年級全部學生的勾選紀錄？其他年級不受影響。建議先備份。`))return;for(const s of roster.filter(x=>x.grade===grade))delete state[s.id];save();render();toast('已清除本年級紀錄')};
let toastTimer;function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2200)}
